name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.4.1
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - name: Checkout game
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/bartender-tools"
          mkdir -p "$tools_dir"
          cd "$tools_dir"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --retry 3 "$base/$editor" -o "$editor"
          curl --fail --location --retry 3 "$base/$templates" -o "$templates"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F "$editor" SHA512-SUMS.txt | sha512sum --check --strict -
          grep -F "$templates" SHA512-SUMS.txt | sha512sum --check --strict -
          unzip -q "$editor"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$tools_dir/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$tools_dir/godot"
          echo "$tools_dir" >> "$GITHUB_PATH"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -j -q "$templates" 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d "$template_dir"

      - name: Configure Android SDK and temporary test signing
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'platforms;android-34' 'build-tools;34.0.0'
          debug_key="$RUNNER_TEMP/bartender-debug.keystore"
          keytool -genkeypair -noprompt -keystore "$debug_key" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 3650
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$debug_key" >> "$GITHUB_ENV"
          python3 tools/configure_android.py

      - name: Import and configure project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/godot-import.log"; then exit 1; fi

      - name: Drink rules and scene smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for test_script in tests/test_drink.gd tests/smoke.gd tests/touch_input.gd tests/pour_effect.gd; do
            timeout 60 godot --headless --path . --script "$test_script" 2>&1 | tee "$RUNNER_TEMP/test.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|Failed to load script' "$RUNNER_TEMP/test.log"; then exit 1; fi
            grep -q 'PASS:' "$RUNNER_TEMP/test.log"
          done

      - name: Export installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug Android build/Behind-the-Bar-3D.apk
          test -s build/Behind-the-Bar-3D.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/Behind-the-Bar-3D.apk
          sha256sum build/Behind-the-Bar-3D.apk > build/SHA256SUMS.txt

      - name: Downloadable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Behind-the-Bar-3D-Android
          path: |
            build/Behind-the-Bar-3D.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
